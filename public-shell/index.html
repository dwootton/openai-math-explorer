<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenAI Math Explorer</title><meta name="description" content="Browse 372 research families from the OpenAI math repository. Read papers, inspect linked Lean proofs, and compare related work."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23112332'/%3E%3Ctext x='6' y='24' font-size='25' fill='%235be0ba'%3E∑%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./header.css"></head><body><header class="site-header"><a href="./explore/" class="brand"><span class="mark">∑</span> OpenAI Math Explorer</a><nav aria-label="Main navigation"><a data-view="map" href="./explore/">Map</a><a data-view="library" href="./#view=library">Papers</a></nav><button id="theme-toggle" data-icon="☀" aria-label="Switch to light mode">Light mode</button></header><main id="app"><p class="loading">Loading the research catalogue…</p></main><footer id="site-footer"><a href="https://github.com/openai/math" target="_blank" rel="noreferrer">Math source ↗</a></footer><div id="toast" role="status" aria-live="polite"></div><script type="module">const p=new URLSearchParams(location.hash.slice(1));if(!p.get('view')||p.get('view')==='map'){const u=new URL('./explore/',location.href);const q=new URLSearchParams();for(const k of ['family','subject'])if(p.has(k))q.set(k,p.get(k));u.hash=q.toString();location.replace(u.href)}else{const root=document.querySelector('#app');function recovery(){if(!root.querySelector('.loading'))return;root.replaceChildren();const text=document.createElement('p');text.textContent='The reader could not finish loading. Please try again.';const retry=document.createElement('a');retry.className='btn';retry.textContent='Reload reader';const url=new URL(location.href);url.searchParams.set('reload',Date.now());retry.href=url.href;root.append(text,retry);}const timeout=setTimeout(recovery,25000);import('./app.js').then(()=>clearTimeout(timeout)).catch(()=>{clearTimeout(timeout);recovery()});}</script></body></html>
