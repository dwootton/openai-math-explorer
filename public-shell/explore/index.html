<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-root" content="../"><title>OpenAI Math Explorer</title><link rel="stylesheet" href="./focus.css"><link rel="stylesheet" href="../vendor/katex.min.css"><meta name="description" content="Search and explore the papers and linked Lean material in the OpenAI math repository."></head><body>
<header><a href="./" class="brand"><span class="mark">∑</span> OpenAI Math Explorer</a><nav aria-label="Main navigation"><a class="active" href="./">Map</a><a href="../#view=library">Papers</a></nav><button id="theme-toggle">Light mode</button></header>
<section class="toolbar"><form id="search-form" class="search"><label for="find" class="sr-only">Search research families</label><div class="search-input"><span aria-hidden="true">⌕</span><input id="find" placeholder="Search papers, subjects, or ideas…" autocomplete="off" maxlength="2048" aria-controls="results" aria-expanded="false"><button id="clear-search" type="button" aria-label="Clear search" hidden>×</button></div><div id="search-popover" hidden><p id="search-status" role="status"></p><div id="results" aria-label="Search results" hidden></div></div></form><div class="controls"><div class="segmented" role="group" aria-label="Compare by"><button data-mode="none" aria-pressed="true">All features</button><button data-mode="topics" aria-pressed="false">Topics</button><button data-mode="methods" aria-pressed="false">Proof techniques</button></div><button id="reset">Reset</button><span class="count">372 families · 722 papers</span></div></section>
<main id="workspace"><section id="stage" aria-label="Research similarity map"><canvas id="map" aria-label="Select a research family on the map. Every family is also available through search."></canvas><div id="labels"></div><div id="loading" role="status">Loading the map…</div><div id="hover-title" aria-live="polite"></div></section><div id="selection" hidden><div><span id="selection-meta"></span><strong id="selection-title"></strong></div><button id="details-toggle" aria-expanded="false">Details</button><button id="clear-selection" aria-label="Clear selected family">×</button></div><section id="card" hidden aria-label="Selected family details"><div class="card-top"><span id="card-meta"></span><button id="close" aria-label="Close details">×</button></div><h2 id="card-title"></h2><button id="eli5" role="switch" aria-checked="true">ELI5</button><div id="guide-label"></div><p id="card-question"></p><p id="card-idea"></p><div class="card-footer"><a id="read">Read paper & scope ↗</a></div><div id="related"></div></section></main>
<footer><div id="subjects" aria-label="Highlight a subject"></div><div class="footnotes"><span><i></i> Nearest neighbors in high D spaces</span><a href="../#view=advanced">More map options</a><a id="project-repo" hidden target="_blank" rel="noreferrer">GitHub ↗</a><a href="https://github.com/openai/math" target="_blank" rel="noreferrer">Math source ↗</a><a href="../#view=privacy">Privacy</a></div></footer><div id="demo-cursor" aria-hidden="true"></div><script type="module" src="./focus.js"></script></body></html>
